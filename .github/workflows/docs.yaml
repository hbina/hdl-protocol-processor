name: docs

on:
  push:
  workflow_dispatch:

jobs:
  docs:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Check generated combinational source
        run: |
          uv sync --locked
          uv run --locked python -m tools.check_generated

      - name: Build docs
        uses: TinyTapeout/tt-gds-action/docs@ihp-cmos5l
