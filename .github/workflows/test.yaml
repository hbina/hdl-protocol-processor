name: test
on: [push, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install iverilog
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y iverilog

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python and locked dependencies
        run: |
          uv python install
          uv sync --locked

      - name: Run tests
        run: |
          uv run pytest test/test_assembler.py test/test_runtime_units.py test/test_runtime_driver.py
          cd test
          uv run make clean
          uv run make
          # make will return success even if the test fails, so check for failure in the results.xml
          ! grep failure results.xml

      - name: I2C capacity experiment (256-word model only)
        run: uv run --locked python study/protocol_exploration/run_i2c.py --expanded-model

      - name: SWD and PS2 capacity experiments (256-word models only)
        run: |
          uv run --locked python study/protocol_exploration/run_wave_b.py swd --expanded-model
          uv run --locked python study/protocol_exploration/run_wave_b.py ps2 --expanded-model

      - name: Ethernet capacity experiment (512-word generic model only)
        run: uv run --locked python study/protocol_exploration/run_wave_c.py ethernet --expanded-model

      - name: Test Summary
        uses: test-summary/action@v2.4
        with:
          paths: |
            test/results.xml
            test/sim_build/i2c_capacity256/results.xml
            test/sim_build/swd_capacity256/results.xml
            test/sim_build/ps2_capacity256/results.xml
            test/sim_build/ethernet_capacity512/results.xml
        if: always()

      - name: upload waveform and test results
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            test/tb.fst
            test/results.xml
            test/sim_build/i2c_capacity256/results.xml
            test/sim_build/i2c_capacity256/evidence.json
            test/sim_build/swd_capacity256/results.xml
            test/sim_build/swd_capacity256/evidence.json
            test/sim_build/ps2_capacity256/results.xml
            test/sim_build/ps2_capacity256/evidence.json
            test/sim_build/ethernet_capacity512/results.xml
            test/sim_build/ethernet_capacity512/evidence.json
            test/output/*
