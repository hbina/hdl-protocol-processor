name: test
on: [push, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install iverilog
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y iverilog

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python and locked dependencies
        run: |
          uv python install
          uv sync --locked

      - name: Run tests
        run: |
          uv run pytest test/test_assembler.py test/test_runtime_units.py test/test_runtime_driver.py
          cd test
          uv run make clean
          uv run make
          # make will return success even if the test fails, so check for failure in the results.xml
          ! grep failure results.xml

      - name: I2C capacity experiment (256-word model only)
        run: uv run --locked python study/protocol_exploration/run_i2c.py --expanded-model

      - name: SWD and PS2 capacity experiments (256-word models only)
        run: |
          uv run --locked python study/protocol_exploration/run_wave_b.py swd --expanded-model
          uv run --locked python study/protocol_exploration/run_wave_b.py ps2 --expanded-model

      - name: Ethernet capacity experiment (512-word generic model only)
        run: uv run --locked python study/protocol_exploration/run_wave_c.py ethernet --expanded-model

      - name: CAN receive capacity experiment (512-word generic model only)
        run: uv run --locked python study/protocol_exploration/run_can.py can --expanded-model

      - name: CAN transmit capacity experiment (512-word generic model only)
        run: uv run --locked python study/protocol_exploration/run_can_tx.py can_tx --expanded-model

      - name: USB packet experiments (512-word models; response deadline unresolved)
        run: |
          uv run --locked python study/protocol_exploration/run_usb_rx.py usb_rx --expanded-model
          uv run --locked python study/protocol_exploration/run_usb_rx_compact.py usb_rx_compact --expanded-model

      - name: Generic frontier model (1024x18 and eight registers; no ASIC fit proof)
        run: |
          uv run --locked pytest -q test/test_frontier_assembler.py
          uv run --locked python study/protocol_exploration/run_frontier.py can_duplex --expanded-model
          uv run --locked python study/protocol_exploration/run_frontier_legacy.py can_duplex --expanded-model

      - name: Live USB and generic leaf calls (isolated model; enumeration pending)
        run: |
          uv run --locked pytest -q test/test_usb_live_units.py
          uv run --locked python study/protocol_exploration/run_usb_live.py usb_live --expanded-model
          uv run --locked python study/protocol_exploration/run_call_legacy.py can_duplex --expanded-model

      - name: USB addressed OUT and generic carry (isolated model; IN/enumeration pending)
        run: |
          uv run --locked pytest -q test/test_carry_frontier.py
          uv run --locked python study/protocol_exploration/run_usb_dense.py usb_dense --expanded-model
          uv run --locked python study/protocol_exploration/run_usb_out.py usb_out --expanded-model
          uv run --locked python study/protocol_exploration/run_carry_legacy.py can_duplex --expanded-model

      - name: Bidirectional USB packets (isolated model; enumeration pending)
        run: |
          uv run --locked pytest -q test/test_usb_in_units.py
          uv run --locked python study/protocol_exploration/run_usb_in.py usb_in --expanded-model

      - name: Live USB TX and autonomous vendor control (isolated model)
        run: |
          uv run --locked pytest -q test/test_usb_control_units.py
          uv run --locked python study/protocol_exploration/run_usb_stream.py usb_stream --expanded-model
          uv run --locked python study/protocol_exploration/run_usb_control.py usb_control --expanded-model

      - name: USB reset and deferred address (isolated model; descriptors pending)
        run: |
          uv run --locked pytest -q test/test_usb_address_units.py
          uv run --locked python study/protocol_exploration/run_usb_address.py usb_address --expanded-model

      - name: Minimal USB enumeration (isolated generic model)
        run: |
          uv run --locked pytest -q test/test_usb_enum_units.py
          uv run --locked python study/protocol_exploration/run_usb_enum.py usb_enum --expanded-model

      - name: Test Summary
        uses: test-summary/action@v2.4
        with:
          paths: |
            test/results.xml
            test/sim_build/i2c_capacity256/results.xml
            test/sim_build/swd_capacity256/results.xml
            test/sim_build/ps2_capacity256/results.xml
            test/sim_build/ethernet_capacity512/results.xml
            test/sim_build/can_capacity512/results.xml
            test/sim_build/can_tx_capacity512/results.xml
            test/sim_build/usb_rx_capacity512/results.xml
            test/sim_build/usb_rx_compact_capacity512/results.xml
            test/sim_build/can_duplex_frontier1024/results.xml
            test/sim_build/frontier1024_legacy/results.xml
            test/sim_build/usb_live_call_frontier1024/results.xml
            test/sim_build/call_frontier1024_legacy/results.xml
            test/sim_build/usb_dense_carry_frontier1024/results.xml
            test/sim_build/usb_out_carry_frontier1024/results.xml
            test/sim_build/carry_frontier1024_legacy/results.xml
            test/sim_build/usb_in_carry_frontier1024/results.xml
            test/sim_build/usb_stream_carry_frontier1024/results.xml
            test/sim_build/usb_control_carry_frontier1024/results.xml
            test/sim_build/usb_address_carry_frontier1024/results.xml
            test/sim_build/usb_enum_carry_frontier1024/results.xml
            test/sim_build/uart_runtime_frontier1024/results.xml
            test/sim_build/jtag_runtime_capacity256/results.xml
        if: always()

      - name: upload waveform and test results
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            test/tb.fst
            test/results.xml
            test/sim_build/i2c_capacity256/results.xml
            test/sim_build/i2c_capacity256/evidence.json
            test/sim_build/swd_capacity256/results.xml
            test/sim_build/swd_capacity256/evidence.json
            test/sim_build/ps2_capacity256/results.xml
            test/sim_build/ps2_capacity256/evidence.json
            test/sim_build/ethernet_capacity512/results.xml
            test/sim_build/ethernet_capacity512/evidence.json
            test/sim_build/can_capacity512/results.xml
            test/sim_build/can_capacity512/evidence.json
            test/sim_build/can_tx_capacity512/results.xml
            test/sim_build/can_tx_capacity512/evidence.json
            test/sim_build/usb_rx_capacity512/results.xml
            test/sim_build/usb_rx_capacity512/evidence.json
            test/sim_build/usb_rx_capacity512/ack_timings.json
            test/sim_build/usb_rx_compact_capacity512/results.xml
            test/sim_build/usb_rx_compact_capacity512/evidence.json
            test/sim_build/usb_rx_compact_capacity512/ack_timings.json
            test/sim_build/can_duplex_frontier1024/results.xml
            test/sim_build/can_duplex_frontier1024/evidence.json
            test/sim_build/frontier1024_legacy/results.xml
            test/sim_build/frontier1024_legacy/evidence.json
            test/sim_build/usb_live_call_frontier1024/results.xml
            test/sim_build/usb_live_call_frontier1024/evidence.json
            test/sim_build/usb_live_call_frontier1024/live_timings.json
            test/sim_build/usb_live_call_frontier1024/live_phase_timings.json
            test/sim_build/call_frontier1024_legacy/results.xml
            test/sim_build/call_frontier1024_legacy/evidence.json
            test/sim_build/usb_dense_carry_frontier1024/results.xml
            test/sim_build/usb_dense_carry_frontier1024/evidence.json
            test/sim_build/usb_dense_carry_frontier1024/live_timings.json
            test/sim_build/usb_dense_carry_frontier1024/live_phase_timings.json
            test/sim_build/usb_out_carry_frontier1024/results.xml
            test/sim_build/usb_out_carry_frontier1024/evidence.json
            test/sim_build/usb_out_carry_frontier1024/out_timings.json
            test/sim_build/usb_out_carry_frontier1024/out_phase_timings.json
            test/sim_build/carry_frontier1024_legacy/results.xml
            test/sim_build/carry_frontier1024_legacy/evidence.json
            test/sim_build/usb_in_carry_frontier1024/results.xml
            test/sim_build/usb_in_carry_frontier1024/evidence.json
            test/sim_build/usb_in_carry_frontier1024/out_timings.json
            test/sim_build/usb_in_carry_frontier1024/out_phase_timings.json
            test/sim_build/usb_in_carry_frontier1024/in_timings.json
            test/sim_build/usb_in_carry_frontier1024/in_phase_timings.json
            test/sim_build/usb_stream_carry_frontier1024/results.xml
            test/sim_build/usb_stream_carry_frontier1024/evidence.json
            test/sim_build/usb_stream_carry_frontier1024/in_timings.json
            test/sim_build/usb_stream_carry_frontier1024/in_phase_timings.json
            test/sim_build/usb_stream_carry_frontier1024/out_timings.json
            test/sim_build/usb_stream_carry_frontier1024/out_phase_timings.json
            test/sim_build/usb_control_carry_frontier1024/results.xml
            test/sim_build/usb_control_carry_frontier1024/evidence.json
            test/sim_build/usb_control_carry_frontier1024/control_timings.json
            test/sim_build/usb_control_carry_frontier1024/control_phase_timings.json
            test/sim_build/usb_address_carry_frontier1024/results.xml
            test/sim_build/usb_address_carry_frontier1024/evidence.json
            test/sim_build/usb_address_carry_frontier1024/control_timings.json
            test/sim_build/usb_address_carry_frontier1024/control_phase_timings.json
            test/sim_build/usb_address_carry_frontier1024/address_timings.json
            test/sim_build/usb_address_carry_frontier1024/address_phase_timings.json
            test/sim_build/usb_enum_carry_frontier1024/results.xml
