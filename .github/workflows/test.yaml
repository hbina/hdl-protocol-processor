name: test
on: [push, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install build tools and Icarus/Yosys
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y iverilog yosys tcl autoconf bison flex g++ make

      # Ubuntu 24.04's packaged Verilator predates cocotb 2's minimum 5.036.
      - name: Build pinned Verilator 5.038
        shell: bash
        run: |
          git clone --depth 1 --branch v5.038 https://github.com/verilator/verilator.git "$RUNNER_TEMP/verilator"
          cd "$RUNNER_TEMP/verilator"
          test "$(git rev-parse HEAD)" = f037ac50b419f675ea23fa38abfc363505d7b43a
          autoconf
          ./configure
          make -C src -j2 opt
          echo "$PWD/bin" >> "$GITHUB_PATH"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python and locked dependencies
        run: |
          uv python install
          uv sync --locked

      - name: Type-check compiler and examples (strict)
        run: uv run --locked pyright

      - name: Verify compiler, deterministic generation and both simulators
        run: |
          uv run --locked ruff format --check .
          uv run --locked pytest
          uv run --locked python -m tools.check_generated
          uv run --locked python -m tools.check_simulation --sim icarus
          uv run --locked python -m tools.check_simulation --sim verilator
          uv run --locked make -B -C test
          uv run --locked make -B -C test SIM=verilator

      - name: Synthesize combinational wrapper and all operations
        run: uv run --locked python -m tools.check_synthesis --yosys .venv/bin/yowasp-yosys
