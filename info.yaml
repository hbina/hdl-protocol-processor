# Tiny Tapeout project information
project:
  title:        "Combinational HDL Demo"      # Project title
  author:       "TBD"      # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "Pure Python expression graphs compiled into combinational hardware"
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     0 # Pure combinational design; clk is unused

  # Jane Street competition allocation: 6x4 CMOS5L tiles.
  tiles: "6x4"

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_combhdl_demo"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"
    - "combhdl_demo.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "a[0]"
  ui[1]: "a[1]"
  ui[2]: "a[2]"
  ui[3]: "a[3]"
  ui[4]: "b[0]"
  ui[5]: "b[1]"
  ui[6]: "b[2]"
  ui[7]: "b[3]"

  # Outputs
  uo[0]: "result[0]"
  uo[1]: "result[1]"
  uo[2]: "result[2]"
  uo[3]: "result[3]"
  uo[4]: "shared[0]"
  uo[5]: "shared[1]"
  uo[6]: "shared[2]"
  uo[7]: "shared[3]"

  # Bidirectional pins
  uio[0]: "choose (input only)"
  uio[1]: "Unused (input only)"
  uio[2]: "Unused (input only)"
  uio[3]: "Unused (input only)"
  uio[4]: "Unused (input only)"
  uio[5]: "Unused (input only)"
  uio[6]: "Unused (input only)"
  uio[7]: "Unused (input only)"

# Do not change!
yaml_version: 6
