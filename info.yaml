# Tiny Tapeout project information
project:
  title:        "Programmable Protocol Emulator"      # Project title
  author:       "TBD"      # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "A tiny programmable engine for cycle-accurate hardware protocol emulation"
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     50000000 # Initial target; revise after timing analysis

  # Jane Street competition allocation: 6x4 CMOS5L tiles.
  tiles: "6x4"

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_protocol_emulator"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"
    - "protocol_core.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "Configuration data 0 / input pin 8"
  ui[1]: "Configuration data 1 / input pin 9"
  ui[2]: "Configuration data 2 / input pin 10"
  ui[3]: "Configuration data 3 / input pin 11"
  ui[4]: "Configuration data 4 / input pin 12"
  ui[5]: "Configuration data 5 / input pin 13"
  ui[6]: "Configuration strobe / input pin 14"
  ui[7]: "Configuration mode"

  # Outputs
  uo[0]: "Output pin 8 / loader status bit 0"
  uo[1]: "Output pin 9 / loader status bit 1"
  uo[2]: "Output pin 10 / loader status bit 2"
  uo[3]: "Output pin 11 / loader status bit 3"
  uo[4]: "Output pin 12 / loader status bit 4"
  uo[5]: "Output pin 13 / loader status bit 5"
  uo[6]: "Output pin 14 / loader status bit 6"
  uo[7]: "Output pin 15 / loader status bit 7"

  # Bidirectional pins
  uio[0]: "Programmable protocol pin 0"
  uio[1]: "Programmable protocol pin 1"
  uio[2]: "Programmable protocol pin 2"
  uio[3]: "Programmable protocol pin 3"
  uio[4]: "Programmable protocol pin 4"
  uio[5]: "Programmable protocol pin 5"
  uio[6]: "Programmable protocol pin 6"
  uio[7]: "Programmable protocol pin 7"

# Do not change!
yaml_version: 6
