[project]
name = "jane-street-design-asic"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "cocotb==2.0.1",
    "pyright>=1.1.414",
    "pytest==8.4.2",
    "ruff>=0.17.2",
    "yowasp-yosys>=0.70.0.0.post1259",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["test/compiler"]

[tool.pyright]
include = ["combhdl", "examples/combinational", "tools/check_generated.py", "tools/check_simulation.py", "tools/check_synthesis.py"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
