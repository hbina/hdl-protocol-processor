[project]
name = "jane-street-design-asic"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "cairosvg==2.8.2",
    "chevron==0.14.0",
    "cocotb==2.0.1",
    "gdstk==0.9.60",
    "gitpython==3.1.45",
    "klayout==0.29.12",
    "librelane==3.1.0.dev3",
    "matplotlib==3.10.6",
    "mistune==3.1.3",
    "numpy==1.26.4",
    "pyright>=1.1.414",
    "pytest==8.4.2",
    "pyyaml==6.0.2",
    "requests==2.32.4",
    "ruff>=0.17.2",
    "yowasp-yosys>=0.70.0.0.post1259",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["test/compiler"]

[tool.pyright]
include = ["combhdl", "examples/combinational", "tools/check_generated.py", "tools/check_simulation.py", "tools/check_synthesis.py", "tools/run_physical.py", "tools/check_mapped.py", "tools/check_checksum.py", "tools/report_physical.py"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
