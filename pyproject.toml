[project]
name = "jane-street-design-asic"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "cocotb==2.0.1",
    "pyright>=1.1.414",
    "pytest==8.4.2",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.pyright]
include = [
    "tools/isa.py",
    "tools/program.py",
    "tools/assembler.py",
    "study/protocol_exploration/isa_variants.py",
    "study/protocol_exploration/fragments.py",
]
extraPaths = [".", "study/protocol_exploration"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
